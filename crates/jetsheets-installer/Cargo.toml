[package]
name = "jetsheets-installer"
version = "0.1.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.17.2"
serde.workspace = true
serde_json.workspace = true
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security_Cryptography"] }
jetsheets-diagnostics = { path = "../jetsheets-diagnostics" }
