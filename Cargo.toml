[workspace]
members = [
    "crates/jetsheets-core",
    "crates/jetsheets-language",
    "crates/jetsheets-storage",
    "crates/jetsheets-charts",
    "crates/jetsheets-ui",
    "crates/jetsheets-installer",
    "crates/jetsheets-diagnostics",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
