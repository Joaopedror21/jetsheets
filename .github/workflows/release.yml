name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate version tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Use uma tag vMAJOR.MINOR.PATCH.' }
          $packages = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages
          foreach ($name in @('jetsheets-ui', 'jetsheets-installer')) {
            $package = $packages | Where-Object { $_.name -eq $name }
            if (-not $package -or "v$($package.version)" -ne $env:RELEASE_TAG) {
              throw "A tag $env:RELEASE_TAG não corresponde à versão de $name."
            }
          }
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build application
        run: cargo build --release --locked -p jetsheets-ui
      - name: Build installer with application included
        env:
          JETSHEETS_BUNDLE_PATH: ${{ github.workspace }}\target\release\jetsheets-ui.exe
        run: cargo build --release --locked -p jetsheets-installer
      - name: Verify GUI subsystem
        shell: pwsh
        run: |
          foreach ($path in @('target/release/jetsheets-ui.exe', 'target/release/jetsheets-installer.exe')) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path).Path)
            $pe = [System.BitConverter]::ToInt32($bytes, 0x3c)
            $signature = [System.BitConverter]::ToUInt32($bytes, $pe)
            $subsystem = [System.BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
            if ($signature -ne 0x00004550 -or $subsystem -ne 2) {
              throw "$path não é um executável Windows GUI (subsystem=$subsystem)."
            }
          }
      - name: Prepare downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/jetsheets-ui.exe dist/JetSheets-windows-x86_64.exe
          Copy-Item target/release/jetsheets-installer.exe dist/JetSheets-Installer-windows-x86_64.exe
          Copy-Item target/release/jetsheets-installer.exe dist/JetSheets-Setup.exe
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG dist/JetSheets-windows-x86_64.exe dist/JetSheets-Installer-windows-x86_64.exe dist/JetSheets-Setup.exe --verify-tag --generate-notes --latest
